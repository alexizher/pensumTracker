[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["pages"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
exclude = ["^pages/", "^\\.venv/"]

[[tool.mypy.overrides]]
# Se quita en el PR 3, cuando los parsers salen del scraper.
module = "scraper.portal_scraper"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.core.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core y portal no importan features"
type = "forbidden"
source_modules = ["app.core", "app.portal"]
forbidden_modules = ["app.features"]

[[tool.importlinter.contracts]]
name = "portal no importa fastapi ni starlette"
type = "forbidden"
source_modules = ["app.portal"]
forbidden_modules = ["fastapi", "starlette"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
